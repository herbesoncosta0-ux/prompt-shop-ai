<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PROMPT SHOP AI</title>
  <style>
    :root {
      --bg: #0a0a0c;
      --card: #121216;
      --orange: #ff6b00;
      --text: #ffffff;
      --muted: #a0a0ab;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 16px; padding-bottom: 80px; }

    header { text-align: center; margin-bottom: 16px; }
    h1 { color: var(--orange); font-size: 1.6rem; margin-bottom: 6px; }
    p.sub { color: var(--muted); font-size: 0.85rem; }

    /* BOTÃO ADMIN FIXO NO TOPO */
    .admin-toggle-btn {
      width: 100%;
      padding: 12px;
      background: var(--orange);
      color: #fff;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      margin-bottom: 16px;
      cursor: pointer;
    }

    /* PAINEL ADMIN EMBUTIDO */
    .admin-panel {
      display: none;
      background: var(--card);
      border: 1px solid var(--orange);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 24px;
    }

    .admin-panel.active { display: block; }
    .admin-panel h2 { font-size: 1.1rem; color: var(--orange); margin-bottom: 12px; }

    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.75rem; color: var(--muted); margin-bottom: 4px; }
    .form-control {
      width: 100%; padding: 10px;
      background: #1a1a20; border: 1px solid #333;
      border-radius: 6px; color: #fff; font-size: 0.85rem;
    }
    textarea.form-control { min-height: 60px; }

    /* SELECTOR DE TIPO DE MÍDIA */
    .media-type-selector { display: flex; gap: 8px; margin-bottom: 8px; }
    .media-type-btn {
      flex: 1; padding: 8px; background: #1a1a20; border: 1px solid #333;
      color: var(--muted); border-radius: 6px; font-size: 0.75rem; font-weight: bold; cursor: pointer;
    }
    .media-type-btn.active { background: var(--orange); color: #fff; border-color: var(--orange); }

    /* ÁREA DE GERENCIAR CATEGORIAS */
    .cat-select-box { display: flex; gap: 8px; align-items: center; }
    .btn-del-cat {
      background: #ef4444; color: #fff; border: none; padding: 10px 12px;
      border-radius: 6px; font-weight: bold; font-size: 0.75rem; cursor: pointer; white-space: nowrap;
    }

    .cat-create-box { display: flex; gap: 8px; margin-top: 6px; }
    .btn-add-cat {
      background: #3b82f6; color: #fff; border: none; padding: 0 12px;
      border-radius: 6px; font-weight: bold; font-size: 0.8rem; cursor: pointer;
    }

    .btn-save {
      width: 100%; padding: 12px;
      background: #10b981; color: #fff;
      border: none; border-radius: 6px; font-weight: bold;
      margin-top: 10px; cursor: pointer;
    }

    /* LISTA ADMIN COM ORDENAÇÃO */
    .admin-list { margin-top: 16px; border-top: 1px solid #333; padding-top: 12px; }
    .admin-item {
      display: flex; justify-content: space-between; align-items: center;
      background: #1a1a20; padding: 8px; border-radius: 6px; margin-bottom: 6px;
      font-size: 0.8rem; gap: 8px;
    }
    .admin-item-title { flex-grow: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .admin-actions { display: flex; gap: 4px; }
    .btn-arrow { background: #333; color: #fff; border: 1px solid #555; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 0.75rem; }
    .btn-arrow:disabled { opacity: 0.3; cursor: not-allowed; }
    .btn-del { background: #ef4444; color: #fff; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; }

    /* BARRA DE CATEGORIAS / FILTROS */
    .categories-bar {
      display: flex; gap: 8px; overflow-x: auto; padding-bottom: 12px; margin-bottom: 16px;
      scrollbar-width: none;
    }
    .categories-bar::-webkit-scrollbar { display: none; }
    .cat-filter-btn {
      padding: 8px 14px; background: #1a1a20; border: 1px solid #333;
      color: var(--muted); border-radius: 20px; font-size: 0.8rem; font-weight: bold;
      white-space: nowrap; cursor: pointer;
    }
    .cat-filter-btn.active { background: var(--orange); color: #fff; border-color: var(--orange); }

    /* GRID DE CARDS */
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    @media (min-width: 768px) { .grid { grid-template-columns: repeat(4, 1fr); gap: 16px; } }

    .card {
      background: var(--card); border: 1px solid #222; border-radius: 10px;
      overflow: hidden; display: flex; flex-direction: column; position: relative;
    }

    .card-badge {
      position: absolute; top: 6px; left: 6px; background: rgba(0,0,0,0.7);
      color: var(--orange); border: 1px solid var(--orange); font-size: 0.6rem;
      font-weight: bold; padding: 2px 6px; border-radius: 4px; text-transform: uppercase;
    }

    .card-img { width: 100%; aspect-ratio: 3/4; object-fit: cover; background: #000; }
    .card-content { padding: 8px; display: flex; flex-direction: column; flex-grow: 1; }
    .card-title { font-size: 0.8rem; font-weight: bold; margin-bottom: 4px; }
    .card-desc { font-size: 0.7rem; color: var(--muted); margin-bottom: 8px; flex-grow: 1; }

    .btn-copy {
      width: 100%; padding: 6px; margin-top: 4px;
      border: none; border-radius: 4px;
      font-size: 0.65rem; font-weight: bold; cursor: pointer;
    }
    .btn-copy-img { background: #222; color: #fff; border: 1px solid #444; }
    .btn-copy-vid { background: var(--orange); color: #fff; }

    /* TOAST NOTIFICAÇÃO */
    .toast {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: #10b981; color: #fff; padding: 10px 20px;
      border-radius: 20px; font-weight: bold; font-size: 0.8rem;
      display: none; z-index: 1000;
    }
  </style>
</head>
<body>

  <header>
    <h1>PROMPT SHOP AI</h1>
    <p class="sub">Seu catálogo de prompts para TikTok Shop e Reels</p>
  </header>

  <!-- BOTÃO QUE ABRE O PAINEL -->
  <button class="admin-toggle-btn" id="toggleAdminBtn">⚙️ ABRIR PAINEL ADMIN / CRIAR</button>

  <!-- PAINEL ADMINISTRATIVO -->
  <div class="admin-panel" id="adminPanel">
    <h2>➕ Cadastrar Novo Prompt</h2>
    <form id="promptForm">
      <div class="form-group">
        <label>Título do Prompt</label>
        <input type="text" id="fTitulo" class="form-control" placeholder="Ex: Modelo no Espelho" required />
      </div>

      <!-- SEÇÃO DE CATEGORIA COM OPÇÃO DE EXCLUIR -->
      <div class="form-group">
        <label>Categoria:</label>
        <div class="cat-select-box">
          <select id="fCategoria" class="form-control" required></select>
          <button type="button" class="btn-del-cat" onclick="deleteCurrentCategory()">🗑️ Excluir</button>
        </div>
        
        <div style="margin-top: 6px;">
          <label style="font-size:0.7rem; color:#888;">Ou crie uma nova categoria:</label>
          <div class="cat-create-box">
            <input type="text" id="fNovaCategoria" class="form-control" placeholder="Ex: Masculino, Fitness..." />
            <button type="button" class="btn-add-cat" onclick="addNewCategory()">+ Criar</button>
          </div>
        </div>
      </div>

      <!-- SELETOR DE MÍDIA -->
      <div class="form-group">
        <label>Mídia (Escolha o método):</label>
        <div class="media-type-selector">
          <button type="button" class="media-type-btn active" id="btnOptFile" onclick="setMediaOption('file')">📁 Galeria / Arquivo</button>
          <button type="button" class="media-type-btn" id="btnOptUrl" onclick="setMediaOption('url')">🔗 Link (URL)</button>
        </div>

        <div id="inputGroupFile">
          <input type="file" id="fFile" class="form-control" accept="image/*,video/*" onchange="handleFileSelect(event)" />
        </div>

        <div id="inputGroupUrl" style="display: none;">
          <input type="text" id="fMediaUrl" class="form-control" placeholder="https://..." />
        </div>

        <input type="hidden" id="fFinalMedia" />
      </div>

      <div class="form-group">
        <label>Descrição Curta</label>
        <input type="text" id="fDesc" class="form-control" placeholder="Para produtos de beleza..." required />
      </div>
      <div class="form-group">
        <label>Prompt de Imagem</label>
        <textarea id="fPromptImg" class="form-control" required></textarea>
      </div>
      <div class="form-group">
        <label>Prompt de Vídeo</label>
        <textarea id="fPromptVid" class="form-control" required></textarea>
      </div>
      <button type="submit" class="btn-save" id="btnSaveSubmit">SALVAR PROMPT</button>
    </form>

    <div class="admin-list">
      <h3 style="font-size:0.85rem; margin-bottom:8px; color:var(--muted);">Reordenar ou Excluir Prompts:</h3>
      <div id="adminListContainer"></div>
    </div>
  </div>

  <!-- BARRA DE FILTROS DE CATEGORIAS -->
  <div class="categories-bar" id="categoriesBar"></div>

  <!-- CONTAINER DOS CARDS -->
  <div class="grid" id="promptsGrid"></div>

  <div class="toast" id="toast">✓ Copiado com sucesso!</div>

  <!-- FIREBASE SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, 
      doc, 
      getDoc, 
      setDoc, 
      onSnapshot 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCLzTSx4IuRNlArJLDdKTmrKtIUAQZf6xk",
      authDomain: "prompt-shop-ai.firebaseapp.com",
      projectId: "prompt-shop-ai",
      storageBucket: "prompt-shop-ai.firebasestorage.app",
      messagingSenderId: "185411404875",
      appId: "1:185411404875:web:4f475750e54790062d39ce"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const docRef = doc(db, "app_data", "main_store");

    var defaultCategories = ["Todas", "Geral", "Feminino", "Masculino", "Eletrônicos"];
    var defaultPrompts = [
      {
        id: 1,
        titulo: "Modelo Natural",
        categoria: "Feminino",
        media: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=500&q=80",
        desc: "Ideal para roupas e acessórios",
        promptImg: "Foto realista de modelo brasileira vestindo o produto da imagem.",
        promptVid: "Vídeo 9:16 estilo UGC de influenciadora mostrando o produto."
      }
    ];

    window.categories = defaultCategories;
    window.prompts = defaultPrompts;
    window.selectedCategory = "Todas";
    window.currentMediaOption = "file";

    // SINCRONIZAÇÃO EM TEMPO REAL COM FIREBASE
    onSnapshot(docRef, (docSnap) => {
      if (docSnap.exists()) {
        const data = docSnap.data();
        if (data.categories) window.categories = data.categories;
        if (data.prompts) window.prompts = data.prompts;
      } else {
        // Se ainda não existir no Firebase, insere os dados iniciais
        saveToFirebase();
      }
      renderCategories();
      render();
      if (document.getElementById("adminPanel").classList.contains("active")) {
        renderAdminList();
      }
    });

    async function saveToFirebase() {
      try {
        await setDoc(docRef, {
          categories: window.categories,
          prompts: window.prompts
        });
      } catch (e) {
        console.error("Erro ao salvar no Firebase:", e);
      }
    }

    window.saveToFirebase = saveToFirebase;
  </script>

  <script>
    var toggleBtn = document.getElementById("toggleAdminBtn");
    var adminPanel = document.getElementById("adminPanel");
    var grid = document.getElementById("promptsGrid");
    var adminList = document.getElementById("adminListContainer");
    var form = document.getElementById("promptForm");

    toggleBtn.addEventListener("click", function() {
      if (adminPanel.classList.contains("active")) {
        adminPanel.classList.remove("active");
        toggleBtn.innerText = "⚙️ ABRIR PAINEL ADMIN / CRIAR";
      } else {
        adminPanel.classList.add("active");
        toggleBtn.innerText = "✕ FECHAR PAINEL ADMIN";
        renderAdminList();
      }
    });

    function renderCategories() {
      var select = document.getElementById("fCategoria");
      select.innerHTML = window.categories.filter(c => c !== "Todas").map(c => `<option value="${c}">${c}</option>`).join('');

      var bar = document.getElementById("categoriesBar");
      bar.innerHTML = window.categories.map(c => {
        var activeClass = (c === window.selectedCategory) ? 'active' : '';
        return `<button class="cat-filter-btn ${activeClass}" onclick="filterByCategory('${c}')">${c}</button>`;
      }).join('');
    }

    function addNewCategory() {
      var input = document.getElementById("fNovaCategoria");
      var val = input.value.trim();
      if (!val) { alert("Digite o nome da categoria!"); return; }
      if (window.categories.includes(val)) { alert("Esta categoria já existe!"); return; }

      window.categories.push(val);
      window.saveToFirebase();
      input.value = "";
      showToast("Nova categoria criada na nuvem!");
    }

    function deleteCurrentCategory() {
      var select = document.getElementById("fCategoria");
      var catToDelete = select.value;

      if (!catToDelete) return;
      if (catToDelete === "Geral") {
        alert("A categoria 'Geral' é padrão e não pode ser excluída.");
        return;
      }

      if (confirm(`Tem certeza que deseja excluir a categoria "${catToDelete}"? Os prompts dela serão movidos para "Geral".`)) {
        window.categories = window.categories.filter(c => c !== catToDelete);
        window.prompts.forEach(p => {
          if (p.categoria === catToDelete) {
            p.categoria = "Geral";
          }
        });

        if (window.selectedCategory === catToDelete) {
          window.selectedCategory = "Todas";
        }

        window.saveToFirebase();
        showToast("Categoria excluída com sucesso!");
      }
    }

    function movePrompt(index, direction) {
      var newIndex = index + direction;
      if (newIndex < 0 || newIndex >= window.prompts.length) return;

      var temp = window.prompts[index];
      window.prompts[index] = window.prompts[newIndex];
      window.prompts[newIndex] = temp;

      window.saveToFirebase();
    }

    function filterByCategory(cat) {
      window.selectedCategory = cat;
      renderCategories();
      render();
    }

    function setMediaOption(option) {
      window.currentMediaOption = option;
      var btnFile = document.getElementById("btnOptFile");
      var btnUrl = document.getElementById("btnOptUrl");
      var groupFile = document.getElementById("inputGroupFile");
      var groupUrl = document.getElementById("inputGroupUrl");

      if (option === 'file') {
        btnFile.classList.add('active');
        btnUrl.classList.remove('active');
        groupFile.style.display = 'block';
        groupUrl.style.display = 'none';
      } else {
        btnUrl.classList.add('active');
        btnFile.classList.remove('active');
        groupUrl.style.display = 'block';
        groupFile.style.display = 'none';
      }
    }

    function handleFileSelect(e) {
      var file = e.target.files[0];
      if (!file) return;
      
      // Limitação simples para Base64 não estourar limite do documento
      if (file.size > 1048576) { 
        alert("A imagem da galeria é muito grande. Escolha uma foto menor que 1MB ou use a opção de Link (URL).");
        e.target.value = "";
        return;
      }

      var reader = new FileReader();
      reader.onload = function(evt) {
        document.getElementById("fFinalMedia").value = evt.target.result;
      };
      reader.readAsDataURL(file);
    }

    function render() {
      var filteredPrompts = window.prompts.filter(p => window.selectedCategory === "Todas" || p.categoria === window.selectedCategory);

      if (filteredPrompts.length === 0) {
        grid.innerHTML = `<div style="grid-column: 1/-1; text-align:center; padding:30px; color:#888;">Nenhum prompt cadastrado nesta categoria.</div>`;
        return;
      }

      grid.innerHTML = filteredPrompts.map(function(p) {
        return `
          <div class="card">
            <span class="card-badge">${p.categoria || 'Geral'}</span>
            <img class="card-img" src="${p.media}" alt="${p.titulo}" onerror="this.src='https://via.placeholder.com/300x400?text=Sem+Imagem'" />
            <div class="card-content">
              <div class="card-title">${p.titulo}</div>
              <div class="card-desc">${p.desc}</div>
              <button class="btn-copy btn-copy-img" onclick="copyText('${escapeJs(p.promptImg)}')">📸 PROMPT IMAGEM</button>
              <button class="btn-copy btn-copy-vid" onclick="copyText('${escapeJs(p.promptVid)}')">🎬 PROMPT VÍDEO</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function renderAdminList() {
      adminList.innerHTML = window.prompts.map(function(p, index) {
        var isFirst = index === 0;
        var isLast = index === window.prompts.length - 1;
        return `
          <div class="admin-item">
            <span class="admin-item-title"><strong>[${p.categoria || 'Geral'}]</strong> ${p.titulo}</span>
            <div class="admin-actions">
              <button class="btn-arrow" onclick="movePrompt(${index}, -1)" ${isFirst ? 'disabled' : ''}>⬆️</button>
              <button class="btn-arrow" onclick="movePrompt(${index}, 1)" ${isLast ? 'disabled' : ''}>⬇️</button>
              <button class="btn-del" onclick="deletePrompt(${p.id})">Excluir</button>
            </div>
          </div>
        `;
      }).join('');
    }

    form.addEventListener("submit", function(e) {
      e.preventDefault();
      
      var finalMediaValue = "";
      if (window.currentMediaOption === 'file') {
        finalMediaValue = document.getElementById("fFinalMedia").value;
        if (!finalMediaValue) {
          alert("Por favor, selecione uma imagem da galeria!");
          return;
        }
      } else {
        finalMediaValue = document.getElementById("fMediaUrl").value;
        if (!finalMediaValue) {
          alert("Por favor, insira o link da imagem!");
          return;
        }
      }

      var newP = {
        id: Date.now(),
        titulo: document.getElementById("fTitulo").value,
        categoria: document.getElementById("fCategoria").value,
        media: finalMediaValue,
        desc: document.getElementById("fDesc").value,
        promptImg: document.getElementById("fPromptImg").value,
        promptVid: document.getElementById("fPromptVid").value
      };

      window.prompts.unshift(newP);
      window.saveToFirebase();
      
      form.reset();
      document.getElementById("fFinalMedia").value = "";
      showToast("Prompt salvo na nuvem com sucesso!");
    });

    function deletePrompt(id) {
      window.prompts = window.prompts.filter(function(p) { return p.id !== id; });
      window.saveToFirebase();
      showToast("Prompt excluído!");
    }

    function copyText(txt) {
      var ta = document.createElement("textarea");
      ta.value = txt;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
      showToast("✓ Copiado para a área de transferência!");
    }

    function escapeJs(str) {
      return str.replace(/'/g, "\\'").replace(/"/g, '&quot;');
    }

    function showToast(msg) {
      var t = document.getElementById("toast");
      t.innerText = msg;
      t.style.display = "block";
      setTimeout(function() { t.style.display = "none"; }, 2000);
    }
  </script>
</body>
</html>
