<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PROMPT SHOP AI - Prompts para TikTok Shop</title>
  <style>
    /* ==========================================================================
       1. VARIÁVEIS E RESET GLOBAL
       ========================================================================== */
    :root {
      --bg-dark: #0a0a0c;
      --bg-card: #121216;
      --border-color: rgba(255, 107, 0, 0.3);
      --primary-orange: #ff6b00;
      --primary-orange-hover: #ff8533;
      --primary-glow: rgba(255, 107, 0, 0.4);
      --text-main: #ffffff;
      --text-muted: #a0a0ab;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --shadow-glow: 0 0 15px rgba(255, 107, 0, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      padding-bottom: 90px;
      min-height: 100vh;
      overflow-x: hidden;
    }

    button { cursor: pointer; border: none; outline: none; background: none; }

    .app-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 16px;
    }

    /* ==========================================================================
       2. CABEÇALHO E BUSCA
       ========================================================================== */
    .header {
      text-align: center;
      padding: 24px 8px 16px 8px;
    }

    .header-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .header-title {
      font-size: 1.8rem;
      font-weight: 900;
      background: linear-gradient(135deg, #fff 40%, var(--primary-orange));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
    }

    .header-subtitle {
      font-size: 0.9rem;
      color: var(--text-muted);
      max-width: 500px;
      margin: 0 auto 20px auto;
      line-height: 1.4;
    }

    .search-box {
      position: relative;
      max-width: 600px;
      margin: 0 auto 20px auto;
    }

    .search-input {
      width: 100%;
      padding: 14px 16px 14px 44px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      color: #fff;
      font-size: 0.95rem;
    }

    .search-input:focus {
      outline: none;
      border-color: var(--primary-orange);
      box-shadow: 0 0 15px var(--primary-glow);
    }

    .search-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1.1rem;
      color: var(--text-muted);
    }

    .categories-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 4px 4px 12px 4px;
      scrollbar-width: none;
      margin-bottom: 20px;
    }

    .categories-scroll::-webkit-scrollbar { display: none; }

    .cat-btn {
      padding: 8px 16px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-muted);
      font-size: 0.85rem;
      white-space: nowrap;
      font-weight: 500;
    }

    .cat-btn.active, .cat-btn:hover {
      background: var(--primary-orange);
      color: #fff;
      border-color: var(--primary-orange);
    }

    /* ==========================================================================
       3. GRID E CARDS (2 COLUNAS NO CELULAR)
       ========================================================================== */
    .prompts-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    @media (min-width: 768px) {
      .prompts-grid { grid-template-columns: repeat(3, 1fr); gap: 20px; }
    }

    @media (min-width: 1024px) {
      .prompts-grid { grid-template-columns: repeat(4, 1fr); gap: 24px; }
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .card-media-wrapper {
      position: relative;
      width: 100%;
      padding-top: 133%;
      background: #000;
      overflow: hidden;
    }

    .card-media {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      object-fit: cover;
    }

    .card-badge {
      position: absolute;
      top: 8px; left: 8px;
      background: linear-gradient(135deg, var(--primary-orange), #ff3300);
      color: #fff;
      font-size: 0.65rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 12px;
      z-index: 2;
    }

    .card-fav-btn {
      position: absolute;
      top: 8px; right: 8px;
      background: rgba(0, 0, 0, 0.6);
      width: 28px; height: 28px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      z-index: 2;
      font-size: 0.85rem;
    }

    .card-body {
      padding: 10px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .card-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-desc {
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-bottom: 10px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      flex-grow: 1;
    }

    .card-actions {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .btn-copy {
      width: 100%;
      padding: 8px 4px;
      border-radius: var(--radius-sm);
      font-size: 0.7rem;
      font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      gap: 4px;
      text-transform: uppercase;
    }

    .btn-copy-img {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
    }

    .btn-copy-vid {
      background: var(--primary-orange);
      color: #fff;
    }

    .btn-copy.copied {
      background: #10b981 !important;
      color: #fff !important;
    }

    /* NAV INFERIOR E FLOATING ADMIN */
    .bottom-nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 60px;
      background: rgba(18, 18, 22, 0.95);
      border-top: 1px solid rgba(255, 107, 0, 0.2);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 100;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      color: var(--text-muted);
      font-size: 0.68rem;
    }

    .nav-item.active { color: var(--primary-orange); }

    .admin-float-btn {
      position: fixed;
      bottom: 75px;
      right: 16px;
      background: var(--primary-orange);
      color: #fff;
      padding: 10px 16px;
      border-radius: 30px;
      font-size: 0.8rem;
      font-weight: 700;
      box-shadow: 0 4px 15px rgba(255, 107, 0, 0.4);
      z-index: 99;
    }

    /* MODAL E TOAST */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      padding: 16px;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-content {
      background: var(--bg-card);
      border: 1px solid var(--primary-orange);
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 550px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 24px;
      position: relative;
    }

    .modal-close {
      position: absolute;
      top: 16px; right: 16px;
      font-size: 1.4rem;
      color: var(--text-muted);
    }

    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 4px; }
    .form-control {
      width: 100%; padding: 10px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      color: #fff; font-size: 0.85rem;
    }
    textarea.form-control { min-height: 70px; }

    .btn-submit {
      width: 100%; padding: 12px;
      background: var(--primary-orange);
      color: #fff; border-radius: var(--radius-sm);
      font-weight: 700; margin-top: 10px;
    }

    .toast {
      position: fixed; top: 20px; left: 50%;
      transform: translateX(-50%) translateY(-100px);
      background: #10b981; color: #fff;
      padding: 12px 24px; border-radius: 30px;
      font-weight: 600; font-size: 0.85rem;
      z-index: 300;
      transition: transform 0.3s ease;
    }

    .toast.show { transform: translateX(-50%) translateY(0); }

    .admin-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px; background: rgba(255, 255, 255, 0.03);
      border-radius: var(--radius-sm); margin-bottom: 8px;
    }

    .btn-edit { background: #3b82f6; color: #fff; padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; }
    .btn-delete { background: #ef4444; color: #fff; padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; }
  </style>
</head>
<body>

  <div class="app-container">
    <header class="header">
      <div class="header-logo">
        <span style="font-size: 1.8rem;">🚀</span>
        <h1 class="header-title">PROMPT SHOP AI</h1>
      </div>
      <p class="header-subtitle">Prompts profissionais para criar imagens e vídeos incríveis para TikTok Shop.</p>

      <div class="search-box">
        <span class="search-icon">🔎</span>
        <input type="text" id="searchInput" class="search-input" placeholder="Pesquisar prompts..." oninput="handleSearch()" />
      </div>

      <div class="categories-scroll" id="categoriesContainer"></div>
    </header>

    <main class="prompts-grid" id="promptsGrid"></main>
  </div>

  <nav class="bottom-nav">
    <button class="nav-item active" onclick="filterNav('home', this)">
      <span>🏠</span><span>Início</span>
    </button>
    <button class="nav-item" onclick="focusSearch()">
      <span>🔎</span><span>Buscar</span>
    </button>
    <button class="nav-item" onclick="filterNav('populares', this)">
      <span>🔥</span><span>Populares</span>
    </button>
    <button class="nav-item" onclick="filterNav('favoritos', this)">
      <span>❤️</span><span>Favoritos</span>
    </button>
  </nav>

  <button class="admin-float-btn" onclick="openAdminModal()">
    ⚙️ Admin / Criar
  </button>

  <div class="toast" id="toastNotification">
    <span id="toastMessage">✓ Prompt copiado!</span>
  </div>

  <div class="modal-overlay" id="detailModal">
    <div class="modal-content">
      <button class="modal-close" onclick="closeModal('detailModal')">✕</button>
      <div id="detailModalBody"></div>
    </div>
  </div>

  <div class="modal-overlay" id="adminModal">
    <div class="modal-content">
      <button class="modal-close" onclick="closeModal('adminModal')">✕</button>
      <h2 style="margin-bottom: 16px; font-size: 1.2rem; color: var(--primary-orange);" id="adminModalTitle">PAINEL ADMINISTRATIVO</h2>
      
      <div style="display: flex; gap: 8px; margin-bottom: 16px;">
        <button class="cat-btn active" id="tabListBtn" onclick="switchAdminTab('list')">Prompts Cadastrados</button>
        <button class="cat-btn" id="tabFormBtn" onclick="switchAdminTab('form')">+ Novo Prompt</button>
      </div>

      <div id="adminListView">
        <div id="adminPromptsList"></div>
      </div>

      <div id="adminFormView" style="display: none;">
        <form id="promptForm" onsubmit="savePrompt(event)">
          <input type="hidden" id="promptId" />
          
          <div class="form-group">
            <label>Título</label>
            <input type="text" id="formTitulo" class="form-control" required />
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <div class="form-group">
              <label>Categoria</label>
              <select id="formCategoria" class="form-control" required>
                <option value="Roupas">Roupas</option>
                <option value="Mulher">Mulher</option>
                <option value="Homem">Homem</option>
                <option value="Beleza">Beleza</option>
                <option value="Eletrônicos">Eletrônicos</option>
                <option value="Casa">Casa</option>
                <option value="Fitness">Fitness</option>
                <option value="Outros">Outros</option>
              </select>
            </div>
            <div class="form-group">
              <label>Selo</label>
              <input type="text" id="formSelo" class="form-control" required />
            </div>
          </div>

          <div class="form-group">
            <label>Descrição</label>
            <input type="text" id="formDescricao" class="form-control" required />
          </div>

          <div class="form-group">
            <label>Mídia (URL ou Arquivo Local)</label>
            <div style="display: flex; gap: 8px; margin-bottom: 6px;">
              <select id="formTipoMidia" class="form-control" style="width: 100px;">
                <option value="imagem">Imagem</option>
                <option value="video">Vídeo</option>
              </select>
              <input type="text" id="formMediaUrl" class="form-control" required />
            </div>
            <input type="file" id="formFileInput" class="form-control" accept="image/*,video/*" onchange="handleFileUpload(event)" />
          </div>

          <div class="form-group">
            <label>Prompt de Imagem</label>
            <textarea id="formPromptImagem" class="form-control" required></textarea>
          </div>

          <div class="form-group">
            <label>Prompt de Vídeo</label>
            <textarea id="formPromptVideo" class="form-control" required></textarea>
          </div>

          <div class="form-group">
            <label>Tags (separadas por vírgula)</label>
            <input type="text" id="formTags" class="form-control" />
          </div>

          <button type="submit" class="btn-submit">SALVAR PROMPT</button>
        </form>
      </div>

    </div>
  </div>

  <!-- SCRIPT REGISTRADO NO FINAL PARA EVITAR ERRO DE DEFINIÇÃO DE FUNÇÕES -->
  <script>
    var INITIAL_PROMPTS = [
      {
        id: 1,
        titulo: "Movimento Natural Premium",
        categoria: "Mulher",
        selo: "🔥 BOMBANDO AGORA",
        descricao: "Prompt para criar uma modelo apresentando o produto de maneira natural.",
        tipoMidia: "imagem",
        mediaUrl: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=600&q=80",
        promptImagem: "Fotografia hiper-realista de uma modelo feminina brasileira apresentando o produto da imagem de referência.",
        promptVideo: "Vídeo UGC hiper-realista vertical 9:16 de uma modelo brasileira apresentando o produto.",
        tags: ["mulher", "ugc"]
      },
      {
        id: 2,
        titulo: "Frente Ao Espelho",
        categoria: "Mulher",
        selo: "🔥 BOMBANDO AGORA",
        descricao: "Modelo apresentando o produto em frente ao espelho.",
        tipoMidia: "imagem",
        mediaUrl: "https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?auto=format&fit=crop&w=600&q=80",
        promptImagem: "Foto estilo mirror selfie de alta qualidade exibindo o produto com precisão.",
        promptVideo: "Vídeo estilo selfie no espelho em 9:16 de uma influenciadora mostrando os detalhes.",
        tags: ["espelho", "selfie"]
      }
    ];

    var CATEGORIES = ["🔥 Todos", "👕 Roupas", "👩 Mulher", "👨 Homem", "💄 Beleza", "📱 Eletrônicos", "🏠 Casa", "🏋️ Fitness", "🎁 Outros"];
    var prompts = [];
    var favorites = [];
    var currentCategory = "🔥 Todos";
    var searchQuery = "";

    window.onload = function() {
      loadStorageData();
      renderCategories();
      renderPrompts();
    };

    function loadStorageData() {
      var storedPrompts = localStorage.getItem("prompt_shop_prompts");
      if (storedPrompts) {
        prompts = JSON.parse(storedPrompts);
      } else {
        prompts = INITIAL_PROMPTS;
        localStorage.setItem("prompt_shop_prompts", JSON.stringify(prompts));
      }

      var storedFavs = localStorage.getItem("prompt_shop_favs");
      if (storedFavs) {
        favorites = JSON.parse(storedFavs);
      }
    }

    function renderCategories() {
      var container = document.getElementById("categoriesContainer");
      container.innerHTML = CATEGORIES.map(function(cat) {
        var isActive = currentCategory === cat;
        return '<button class="cat-btn ' + (isActive ? 'active' : '') + '" onclick="selectCategory(\'' + cat + '\', this)">' + cat + '</button>';
      }).join('');
    }

    function selectCategory(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      renderPrompts();
    }

    function renderPrompts() {
      var grid = document.getElementById("promptsGrid");
      var filtered = prompts.filter(function(p) {
        var matchCat = true;
        if (currentCategory !== "🔥 Todos") {
          var targetName = currentCategory.replace(/^[\u{1F300}-\u{1F9FF}\u{2600}-\u{26FF}]\s*/u, '').trim();
          matchCat = p.categoria.toLowerCase() === targetName.toLowerCase();
        }

        var matchSearch = true;
        if (searchQuery.trim() !== "") {
          var q = searchQuery.toLowerCase();
          matchSearch = p.titulo.toLowerCase().includes(q) || p.descricao.toLowerCase().includes(q);
        }

        return matchCat && matchSearch;
      });

      if (filtered.length === 0) {
        grid.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:30px; color:#aaa;">Nenhum prompt encontrado.</div>';
        return;
      }

      grid.innerHTML = filtered.map(function(p) {
        var isFav = favorites.includes(p.id);
        var mediaTag = p.tipoMidia === 'video' 
          ? '<video class="card-media" src="' + p.mediaUrl + '" autoplay loop muted playsinline></video>'
          : '<img class="card-media" src="' + p.mediaUrl + '" alt="' + p.titulo + '" />';

        return `
          <div class="card">
            <span class="card-badge">${p.selo}</span>
            <button class="card-fav-btn" onclick="toggleFavorite(${p.id})">${isFav ? '❤️' : '🤍'}</button>
            <div class="card-media-wrapper" onclick="openDetailModal(${p.id})">${mediaTag}</div>
            <div class="card-body">
              <h3 class="card-title">${p.titulo}</h3>
              <p class="card-desc">${p.descricao}</p>
              <div class="card-actions">
                <button class="btn-copy btn-copy-img" onclick="copyImagePrompt(${p.id}, this)">📸 Prompt Imagem</button>
                <button class="btn-copy btn-copy-vid" onclick="copyVideoPrompt(${p.id}, this)">🎬 Prompt Vídeo</button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function copyTextToClipboard(text, callback) {
      if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(callback).catch(function() { fallbackCopy(text, callback); });
      } else {
        fallbackCopy(text, callback);
      }
    }

    function fallbackCopy(text, callback) {
      var ta = document.createEle
