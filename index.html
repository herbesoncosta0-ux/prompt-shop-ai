<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PROMPT SHOP AI</title>
  <style>
    :root {
      --bg: #0a0a0c;
      --card: #121216;
      --orange: #ff6b00;
      --text: #ffffff;
      --muted: #a0a0ab;
      --green: #10b981;
      --blue: #3b82f6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 16px; padding-bottom: 80px; }

    header { text-align: center; margin-bottom: 16px; }
    h1 { color: var(--orange); font-size: 1.6rem; margin-bottom: 6px; }
    p.sub { color: var(--muted); font-size: 0.85rem; }

    /* BOTÃO ADMIN FIXO NO TOPO */
    .admin-toggle-btn {
      width: 100%;
      padding: 12px;
      background: var(--orange);
      color: #fff;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      margin-bottom: 16px;
      cursor: pointer;
      transition: transform 0.15s ease, background-color 0.2s ease;
    }
    .admin-toggle-btn:active { transform: scale(0.98); }

    /* PAINEL ADMIN EMBUTIDO */
    .admin-panel {
      display: none;
      background: var(--card);
      border: 1px solid var(--orange);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 24px;
      animation: fadeIn 0.3s ease;
    }

    .admin-panel.active { display: block; }
    .admin-panel h2 { font-size: 1.1rem; color: var(--orange); margin-bottom: 12px; }

    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.75rem; color: var(--muted); margin-bottom: 4px; }
    .form-control {
      width: 100%; padding: 10px;
      background: #1a1a20; border: 1px solid #333;
      border-radius: 6px; color: #fff; font-size: 0.85rem;
    }
    textarea.form-control { min-height: 60px; }

    /* SELECTOR DE TIPO DE MÍDIA */
    .media-type-selector { display: flex; gap: 8px; margin-bottom: 8px; }
    .media-type-btn {
      flex: 1; padding: 8px; background: #1a1a20; border: 1px solid #333;
      color: var(--muted); border-radius: 6px; font-size: 0.75rem; font-weight: bold; cursor: pointer;
    }
    .media-type-btn.active { background: var(--orange); color: #fff; border-color: var(--orange); }

    /* ÁREA DE GERENCIAR CATEGORIAS */
    .cat-select-box { display: flex; gap: 8px; align-items: center; }
    .btn-del-cat {
      background: #ef4444; color: #fff; border: none; padding: 10px 12px;
      border-radius: 6px; font-weight: bold; font-size: 0.75rem; cursor: pointer; white-space: nowrap;
    }

    .cat-create-box { display: flex; gap: 8px; margin-top: 6px; }
    .btn-add-cat {
      background: var(--blue); color: #fff; border: none; padding: 0 12px;
      border-radius: 6px; font-weight: bold; font-size: 0.8rem; cursor: pointer;
    }

    .btn-save {
      width: 100%; padding: 12px;
      background: var(--green); color: #fff;
      border: none; border-radius: 6px; font-weight: bold;
      margin-top: 10px; cursor: pointer;
    }

    .btn-cancel-edit {
      width: 100%; padding: 8px;
      background: #4b5563; color: #fff;
      border: none; border-radius: 6px; font-weight: bold;
      margin-top: 6px; cursor: pointer; display: none;
    }

    /* LISTA ADMIN COM ORDENAÇÃO E EDIÇÃO */
    .admin-list { margin-top: 16px; border-top: 1px solid #333; padding-top: 12px; }
    .admin-item {
      display: flex; justify-content: space-between; align-items: center;
      background: #1a1a20; padding: 8px; border-radius: 6px; margin-bottom: 6px;
      font-size: 0.8rem; gap: 8px;
    }
    .admin-item-title { flex-grow: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .admin-actions { display: flex; gap: 4px; }
    .btn-arrow { background: #333; color: #fff; border: 1px solid #555; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 0.75rem; }
    .btn-arrow:disabled { opacity: 0.3; cursor: not-allowed; }
    .btn-edit { background: var(--blue); color: #fff; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 0.75rem; }
    .btn-del { background: #ef4444; color: #fff; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 0.75rem; }

    /* BARRA DE CATEGORIAS / FILTROS */
    .categories-bar {
      display: flex; gap: 8px; overflow-x: auto; padding-bottom: 12px; margin-bottom: 16px;
      scrollbar-width: none;
    }
    .categories-bar::-webkit-scrollbar { display: none; }
    .cat-filter-btn {
      padding: 8px 14px; background: #1a1a20; border: 1px solid #333;
      color: var(--muted); border-radius: 20px; font-size: 0.8rem; font-weight: bold;
      white-space: nowrap; cursor: pointer; transition: all 0.2s ease;
    }
    .cat-filter-btn.active { background: var(--orange); color: #fff; border-color: var(--orange); }

    /* GRID DE CARDS */
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    @media (min-width: 768px) { .grid { grid-template-columns: repeat(4, 1fr); gap: 16px; } }

    .card {
      background: var(--card); border: 1px solid #222; border-radius: 10px;
      overflow: hidden; display: flex; flex-direction: column; position: relative;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .card-badge {
      position: absolute; top: 6px; left: 6px; background: rgba(0,0,0,0.7);
      color: var(--orange); border: 1px solid var(--orange); font-size: 0.6rem;
      font-weight: bold; padding: 2px 6px; border-radius: 4px; text-transform: uppercase;
      z-index: 2;
    }

    .card-media { width: 100%; aspect-ratio: 3/4; object-fit: cover; background: #000; display: block; }
    .card-content { padding: 8px; display: flex; flex-direction: column; flex-grow: 1; }
    .card-title { font-size: 0.8rem; font-weight: bold; margin-bottom: 4px; }
    .card-desc { font-size: 0.7rem; color: var(--muted); margin-bottom: 8px; flex-grow: 1; }

    /* BOTÕES COM ANIMAÇÃO DE CLIQUE */
    .btn-copy {
      width: 100%; padding: 6px; margin-top: 4px;
      border: none; border-radius: 4px;
      font-size: 0.65rem; font-weight: bold; cursor: pointer;
      transition: transform 0.15s ease, background-color 0.2s ease, box-shadow 0.2s ease;
      position: relative;
      overflow: hidden;
    }
    .btn-copy:active {
      transform: scale(0.95);
    }
    .btn-copy-img { background: #222; color: #fff; border: 1px solid #444; }
    .btn-copy-vid { background: var(--orange); color: #fff; }

    /* ESTADO TEMPORÁRIO AO COPIAR COM ANIMAÇÃO POP */
    .btn-copy.copied {
      background: var(--green) !important;
      color: #fff !important;
      border-color: var(--green) !important;
      box-shadow: 0 0 12px rgba(16, 185, 129, 0.6);
      animation: copyPop 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes copyPop {
      0% { transform: scale(0.92); }
      50% { transform: scale(1.06); }
      100% { transform: scale(1); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* TOAST DE NOTIFICAÇÃO ANIMADO */
    .toast {
      position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%) translateY(100px);
      background: var(--green); color: #fff; padding: 12px 24px;
      border-radius: 30px; font-weight: bold; font-size: 0.85rem;
      box-shadow: 0 8px 20px rgba(0,0,0,0.6), 0 0 15px rgba(16, 185, 129, 0.4);
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

  <header>
    <h1>PROMPT SHOP AI</h1>
    <p class="sub">Seu catálogo de prompts para TikTok Shop e Reels</p>
  </header>

  <!-- BOTÃO QUE ABRE O PAINEL -->
  <button class="admin-toggle-btn" id="toggleAdminBtn">⚙️ ABRIR PAINEL ADMIN / CRIAR</button>

  <!-- PAINEL ADMINISTRATIVO -->
  <div class="admin-panel" id="adminPanel">
    <h2 id="formTitle">➕ Cadastrar Novo Prompt</h2>
    <form id="promptForm">
      <input type="hidden" id="fEditingId" value="" />

      <div class="form-group">
        <label>Título do Prompt</label>
        <input type="text" id="fTitulo" class="form-control" placeholder="Ex: Modelo no Espelho" required />
      </div>

      <!-- SEÇÃO DE CATEGORIA COM OPÇÃO DE EXCLUIR -->
      <div class="form-group">
        <label>Categoria:</label>
        <div class="cat-select-box">
          <select id="fCategoria" class="form-control" required></select>
          <button type="button" class="btn-del-cat" onclick="deleteCurrentCategory()">🗑️ Excluir</button>
        </div>
        
        <div style="margin-top: 6px;">
          <label style="font-size:0.7rem; color:#888;">Ou crie uma nova categoria:</label>
          <div class="cat-create-box">
            <input type="text" id="fNovaCategoria" class="form-control" placeholder="Ex: Masculino, Fitness..." />
            <button type="button" class="btn-add-cat" onclick="addNewCategory()">+ Criar</button>
          </div>
        </div>
      </div>

      <!-- SELETOR DE MÍDIA -->
      <div class="form-group">
        <label>Mídia (Escolha o método):</label>
        <div class="media-type-selector">
          <button type="button" class="media-type-btn active" id="btnOptFile" onclick="setMediaOption('file')">📁 Foto/Vídeo Galeria</button>
          <button type="button" class="media-type-btn" id="btnOptUrl" onclick="setMediaOption('url')">🔗 Link (URL)</button>
        </div>

        <div id="inputGroupFile">
          <input type="file" id="fFile" class="form-control" accept="image/*,video/*" onchange="handleFileSelect(event)" />
        </div>

        <div id="inputGroupUrl" style="display: none;">
          <input type="text" id="fMediaUrl" class="form-control" placeholder="https://... (Foto ou Vídeo MP4)" />
        </div>

        <input type="hidden" id="fFinalMedia" />
      </div>

      <div class="form-group">
        <label>Descrição Curta</label>
        <input type="text" id="fDesc" class="form-control" placeholder="Para produtos de beleza..." required />
      </div>
      <div class="form-group">
        <label>Prompt de Imagem</label>
        <textarea id="fPromptImg" class="form-control" required></textarea>
      </div>
      <div class="form-group">
        <label>Prompt de Vídeo</label>
        <textarea id="fPromptVid" class="form-control" required></textarea>
      </div>

      <button type="submit" class="btn-save" id="btnSaveSubmit">SALVAR PROMPT</button>
      <button type="button" class="btn-cancel-edit" id="btnCancelEdit" onclick="cancelEditing()">Cancelar Edição</button>
    </form>

    <div class="admin-list">
      <h3 style="font-size:0.85rem; margin-bottom:8px; color:var(--muted);">Gerenciar, Editar ou Reordenar Prompts:</h3>
      <div id="adminListContainer"></div>
    </div>
  </div>

  <!-- BARRA DE FILTROS DE CATEGORIAS -->
  <div class="categories-bar" id="categoriesBar"></div>

  <!-- CONTAINER DOS CARDS -->
  <div class="grid" id="promptsGrid"></div>

  <div class="toast" id="toast"><span>✓</span> <span id="toastMsg">Copiado com sucesso!</span></div>

  <!-- FIREBASE SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, 
      doc, 
      setDoc, 
      onSnapshot 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCLzTSx4IuRNlArJLDdKTmrKtIUAQZf6xk",
      authDomain: "prompt-shop-ai.firebaseapp.com",
      projectId: "prompt-shop-ai",
      storageBucket: "prompt-shop-ai.firebasestorage.app",
      messagingSenderId: "185411404875",
      appId: "1:185411404875:web:4f475750e54790062d39ce"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const docRef = doc(db, "app_data", "main_store");

    var defaultCategories = ["Todas", "Geral", "Feminino", "Masculino", "Eletrônicos"];
    var defaultPrompts = [
      {
        id: 1,
        titulo: "Modelo Natural",
        categoria: "Feminino",
        media: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=500&q=80",
        desc: "Ideal para roupas e acessórios",
        promptImg: "Foto realista de modelo brasileira vestindo o produto da imagem.",
        promptVid: "Vídeo 9:16 estilo UGC de influenciadora mostrando o produto."
      }
    ];

    window.categories = defaultCategories;
    window.prompts = defaultPrompts;
    window.selectedCategory = "Todas";
    window.currentMediaOption = "file";

    var localCats = JSON.parse(localStorage.getItem("ps_cats"));
    var localPrompts = JSON.parse(localStorage.getItem("ps_data"));

    onSnapshot(docRef, (docSnap) => {
      if (docSnap.exists()) {
        const data = docSnap.data();
        
        if (localPrompts && localPrompts.length > 0) {
          window.prompts = combineUniquePrompts(data.prompts || [], localPrompts);
          window.categories = combineUniqueCategories(data.categories || [], localCats || []);
          localStorage.removeItem("ps_data");
          localStorage.removeItem("ps_cats");
          saveToFirebase();
        } else {
          if (data.categories) window.categories = data.categories;
          if (data.prompts) window.prompts = data.prompts;
        }
      } else {
        if (localPrompts && localPrompts.length > 0) {
          window.prompts = localPrompts;
          if (localCats) window.categories = localCats;
        }
        saveToFirebase();
      }

      renderCategories();
      render();
      if (document.getElementById("adminPanel").classList.contains("active")) {
        renderAdminList();
      }
    });

    function combineUniquePrompts(cloud, local) {
      const map = new Map();
      local.forEach(item => map.set(item.id, item));
      cloud.forEach(item => map.set(item.id, item));
      return Array.from(map.values());
    }

    function combineUniqueCategories(cloud, local) {
      return Array.from(new Set([...cloud, ...local]));
    }

    async function saveToFirebase() {
      try {
        await setDoc(docRef, {
          categories: window.categories,
          prompts: window.prompts
        });
        return true;
      } catch (e) {
        console.error("Erro ao salvar no Firebase:", e);
        alert("Erro ao salvar na nuvem: " + e.message);
        return false;
      }
    }

    window.saveToFirebase = saveToFirebase;
  </script>

  <script>
    var toggleBtn = document.getElementById("toggleAdminBtn");
    var adminPanel = document.getElementById("adminPanel");
    var grid = document.getElementById("promptsGrid");
    var adminList = document.getElementById("adminListContainer");
    var form = document.getElementById("promptForm");

    toggleBtn.addEventListener("click", function() {
      if (adminPanel.classList.contains("active")) {
        adminPanel.classList.remove("active");
        toggleBtn.innerText = "⚙️ ABRIR PAINEL ADMIN / CRIAR";
        cancelEditing();
      } else {
        adminPanel.classList.add("active");
        toggleBtn.innerText = "✕ FECHAR PAINEL ADMIN";
        renderAdminList();
      }
    });

    function renderCategories() {
      var select = document.getElementById("fCategoria");
      select.innerHTML = window.categories.filter(c => c !== "Todas").map(c => `<option value="${c}">${c}</option>`).join('');

      var bar = document.getElementById("categoriesBar");
      bar.innerHTML = window.categories.map(c => {
        var activeClass = (c === window.selectedCategory) ? 'active' : '';
        return `<button class="cat-filter-btn ${activeClass}" onclick="filterByCategory('${c}')">${c}</button>`;
      }).join('');
    }

    async function addNewCategory() {
      var input = document.getElementById("fNovaCategoria");
      var val = input.value.trim();
      if (!val) { alert("Digite o nome da categoria!"); return; }
      if (window.categories.includes(val)) { alert("Esta categoria já existe!"); return; }

      window.categories.push(val);
      var ok = await window.saveToFirebase();
      if (ok) {
        input.value = "";
        showToast("Nova categoria criada na nuvem!");
      }
    }

    async function deleteCurrentCategory() {
      var select = document.getElementById("fCategoria");
      var catToDelete = select.value;

      if (!catToDelete) return;
      if (catToDelete === "Geral") {
        alert("A categoria 'Geral' é padrão e não pode ser excluída.");
        return;
      }

      if (confirm(`Tem certeza que deseja excluir a categoria "${catToDelete}"? Os prompts dela serão movidos para "Geral".`)) {
        window.categories = window.categories.filter(c => c !== catToDelete);
        window.prompts.forEach(p => {
          if (p.categoria === catToDelete) {
            p.categoria = "Geral";
          }
        });

        if (window.selectedCategory === catToDelete) {
          window.selectedCategory = "Todas";
        }

        await window.saveToFirebase();
        showToast("Categoria excluída com sucesso!");
      }
    }

    async function movePrompt(index, direction) {
      var newIndex = index + direction;
      if (newIndex < 0 || newIndex >= window.prompts.length) return;

      var temp = window.prompts[index];
      window.prompts[index] = window.prompts[newIndex];
      window.prompts[newIndex] = temp;

      await window.saveToFirebase();
    }

    function filterByCategory(cat) {
      window.selectedCategory = cat;
      renderCategories();
      render();
    }

    function setMediaOption(option) {
      window.currentMediaOption = option;
      var btnFile = document.getElementById("btnOptFile");
      var btnUrl = document.getElementById("btnOptUrl");
      var groupFile = document.getElementById("inputGroupFile");
      var groupUrl = document.getElementById("inputGroupUrl");

      if (option === 'file') {
        btnFile.classList.add('active');
        btnUrl.classList.remove('active');
        groupFile.style.display = 'block';
        groupUrl.style.display = 'none';
      } else {
        btnUrl.classList.add('active');
        btnFile.classList.remove('active');
        groupFile.style.display = 'none';
        groupUrl.style.display = 'block';
      }
    }

    function handleFileSelect(e) {
      var file = e.target.files[0];
      if (!file) return;

      var reader = new FileReader();

      // SE FOR VÍDEO
      if (file.type.startsWith('video/')) {
        reader.onload = function(evt) {
          document.getElementById("fFinalMedia").value = evt.target.result;
        };
        reader.readAsDataURL(file);
        return;
      }

      // SE FOR IMAGEM (COMPRIME)
      reader.onload = function(evt) {
        var img = new Image();
        img.onload = function() {
          var canvas = document.createElement("canvas");
          var max_size = 600;
          var width = img.width;
          var height = img.height;

          if (width > height) {
            if (width > max_size) {
              height *= max_size / width;
              width = max_size;
            }
          } else {
            if (height > max_size) {
              width *= max_size / height;
              height = max_size;
            }
          }

          canvas.width = width;
          canvas.height = height;
          var ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, width, height);

          var dataUrl = canvas.toDataURL("image/jpeg", 0.7);
          document.getElementById("fFinalMedia").value = dataUrl;
        };
        img.src = evt.target.result;
      };
      reader.readAsDataURL(file);
    }

    function isVideoMedia(src) {
      if (!src) return false;
      if (src.startsWith('data:video/')) return true;
      var lower = src.toLowerCase();
      return lower.endsWith('.mp4') || lower.endsWith('.webm') || lower.endsWith('.ogg') || lower.endsWith('.mov');
    }

    // CONVERTE TEXTO PARA BASE64 PARA PREVENIR ERROS DE ASPAS E QUEBRA DE LINHA
    function toBase64(str) {
      try {
        return btoa(unescape(encodeURIComponent(str || "")));
      } catch (e) {
        return "";
      }
    }

    function fromBase64(b64) {
      try {
        return decodeURIComponent(escape(atob(b64 || "")));
      } catch (e) {
        return "";
      }
    }

    function render() {
      var filteredPrompts = window.prompts.filter(p => window.selectedCategory === "Todas" || p.categoria === window.selectedCategory);

      if (filteredPrompts.length === 0) {
        grid.innerHTML = `<div style="grid-column: 1/-1; text-align:center; padding:30px; color:#888;">Nenhum prompt cadastrado nesta categoria.</div>`;
        return;
      }

      grid.innerHTML = filteredPrompts.map(function(p) {
        var isVid = isVideoMedia(p.media);
        var mediaHtml = isVid 
          ? `<video class="card-media" src="${p.media}" autoplay loop muted playsinline></video>`
          : `<img class="card-media" src="${p.media}" alt="${p.titulo}" onerror="this.src='https://via.placeholder.com/300x400?text=Sem+Imagem'" />`;

        var b64Img = toBase64(p.promptImg);
        var b64Vid = toBase64(p.promptVid);

        return `
          <div class="card">
            <span class="card-badge">${p.categoria || 'Geral'}</span>
            ${mediaHtml}
            <div class="card-content">
              <div class="card-title">${p.titulo}</div>
              <div class="card-desc">${p.desc}</div>
              <button class="btn-copy btn-copy-img" onclick="copyText(event, '${b64Img}', '📸 PROMPT IMAGEM')">📸 PROMPT IMAGEM</button>
              <button class="btn-copy btn-copy-vid" onclick="copyText(event, '${b64Vid}', '🎬 PROMPT VÍDEO')">🎬 PROMPT VÍDEO</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function renderAdminList() {
      adminList.innerHTML = window.prompts.map(function(p, index) {
        var isFirst = index === 0;
        var isLast = index === window.prompts.length - 1;
        return `
          <div class="admin-item">
            <span class="admin-item-title"><strong>[${p.categoria || 'Geral'}]</strong> ${p.titulo}</span>
            <div class="admin-actions">
              <button class="btn-arrow" onclick="movePrompt(${index}, -1)" ${isFirst ? 'disabled' : ''}>⬆️</button>
              <button class="btn-arrow" onclick="movePrompt(${index}, 1)" ${isLast ? 'disabled' : ''}>⬇️</button>
              <button class="btn-edit" onclick="startEditing(${p.id})">✏️ Editar</button>
              <button class="btn-del" onclick="deletePrompt(${p.id})">Excluir</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function startEditing(id) {
      var p = window.prompts.find(item => item.id === id);
      if (!p) return;

      document.getElementById("fEditingId").value = p.id;
      document.getElementById("fTitulo").value = p.titulo;
      document.getElementById("fCategoria").value = p.categoria || "Geral";
      document.getElementById("fDesc").value = p.desc;
      document.getElementById("fPromptImg").value = p.promptImg;
      document.getElementById("fPromptVid").value = p.promptVid;

      document.getElementById("fFinalMedia").value = p.media;
      if (p.media.startsWith("http")) {
        setMediaOption('url');
        document.getElementById("fMediaUrl").value = p.media;
      } else {
        setMediaOption('file');
      }

      document.getElementById("formTitle").innerText = "✏️ Editar Prompt";
      var btnSubmit = document.getElementById("btnSaveSubmit");
      btnSubmit.innerText = "SALVAR ALTERAÇÕES";
      btnSubmit.style.background = "var(--blue)";
      document.getElementById("btnCancelEdit").style.display = "block";

      adminPanel.scrollIntoView({ behavior: 'smooth' });
    }

    function cancelEditing() {
      form.reset();
      document.getElementById("fEditingId").value = "";
      document.getElementById("fFinalMedia").value = "";
      document.getElementById("formTitle").innerText = "➕ Cadastrar Novo Prompt";
      
      var btnSubmit = document.getElementById("btnSaveSubmit");
      btnSubmit.innerText = "SALVAR PROMPT";
      btnSubmit.style.background = "var(--green)";
      document.getElementById("btnCancelEdit").style.display = "none";
      setMediaOption('file');
    }

    form.addEventListener("submit", async function(e) {
      e.preventDefault();
      
      var editingId = document.getElementById("fEditingId").value;
      var isEditing = editingId !== "";

      var btnSubmit = document.getElementById("btnSaveSubmit");
      btnSubmit.innerText = "SALVANDO NA NUVEM...";
      btnSubmit.disabled = true;
      
      var finalMediaValue = document.getElementById("fFinalMedia").value;

      if (window.currentMediaOption === 'url') {
        finalMediaValue = document.getElementById("fMediaUrl").value;
      }

      if (!finalMediaValue) {
        alert("Por favor, selecione uma foto/vídeo da galeria ou insira o link da mídia!");
        btnSubmit.innerText = isEditing ? "SALVAR ALTERAÇÕES" : "SALVAR PROMPT";
        btnSubmit.disabled = false;
        return;
      }

      if (isEditing) {
        var targetId = parseInt(editingId);
        var idx = window.prompts.findIndex(p => p.id === targetId);
        if (idx !== -1) {
          window.prompts[idx] = {
            id: targetId,
            titulo: document.getElementById("fTitulo").value,
            categoria: document.getElementById("fCategoria").value,
            media: finalMediaValue,
            desc: document.getElementById("fDesc").value,
            promptImg: document.getElementById("fPromptImg").value,
            promptVid: document.getElementById("fPromptVid").value
          };
        }
      } else {
        var newP = {
          id: Date.now(),
          titulo: document.getElementById("fTitulo").value,
          categoria: document.getElementById("fCategoria").value,
          media: finalMediaValue,
          desc: document.getElementById("fDesc").value,
          promptImg: document.getElementById("fPromptImg").value,
          promptVid: document.getElementById("fPromptVid").value
        };
        window.prompts.unshift(newP);
      }

      var ok = await window.saveToFirebase();
      btnSubmit.disabled = false;

      if (ok) {
        showToast(isEditing ? "Prompt atualizado na nuvem!" : "Prompt salvo na nuvem!");
        cancelEditing();
      } else {
        btnSubmit.innerText = isEditing ? "SALVAR ALTERAÇÕES" : "SALVAR PROMPT";
      }
    });

    async function deletePrompt(id) {
      if (confirm("Tem certeza que deseja excluir este prompt da nuvem?")) {
        window.prompts = window.prompts.filter(function(p) { return p.id !== id; });
        await window.saveToFirebase();
        showToast("Prompt excluído!");
        cancelEditing();
      }
    }

    // FUNÇÃO DE CÓPIA GARANTIDA PARA TODOS OS PROMPTS E ANIMAÇÃO EM 100% DOS BOTÕES
    function copyText(event, b64Text, originalText) {
      var btn = event.currentTarget;
      var textToCopy = fromBase64(b64Text);

      var ta = document.createElement("textarea");
      ta.value = textToCopy;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);

      // Aplica a animação no botão
      btn.classList.add("copied");
      btn.innerText = "✓ COPIADO!";

      setTimeout(function() {
        btn.classList.remove("copied");
        btn.innerText = originalText;
      }, 1200);

      showToast("Prompt copiado para a área de transferência!");
    }

    var toastTimeout;
    function showToast(msg) {
      var t = document.getElementById("toast");
      var tMsg = document.getElementById("toastMsg");
      tMsg.innerText = msg;
      
      t.classList.add("show");

      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(function() {
        t.classList.remove("show");
      }, 2000);
    }
  </script>
</body>
</html>
